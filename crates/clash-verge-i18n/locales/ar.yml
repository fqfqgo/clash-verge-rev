_version: 1
systemProxy:
  fallbackTun:
    title: System Proxy Failed
    body: The system proxy could not be enabled, so virtual NIC (TUN) mode has been turned on automatically.
  verificationError:
    title: Cannot Read System Proxy Status
    body: Unable to read the actual system proxy status. If the network does not work properly, the system proxy may not have been set successfully; try virtual NIC (TUN) mode instead.
notifications:
  dashboardToggled:
    title: لوحة التحكم
    body: تم تحديث حالة عرض لوحة التحكم.
  clashModeChanged:
    title: تبديل الوضع
    body: تم التبديل إلى {mode}.
  systemProxyToggled:
    title: وكيل النظام
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: وضع TUN
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: الوضع الخفيف
    body: تم الدخول إلى الوضع الخفيف.
  profilesReactivated:
    title: الملفات التعريفية
    body: تمت إعادة تفعيل الملف التعريفي.
  appQuit:
    title: على وشك الخروج
    body: Clash Verge على وشك الخروج.
  appHidden:
    title: تم إخفاء التطبيق
    body: Clash Verge يعمل في الخلفية.
  updateReady:
    title: Clash Verge Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
service:
  adminInstallPrompt: يتطلب تثبيت خدمة Clash Verge صلاحيات المسؤول.
  adminUninstallPrompt: يتطلب إلغاء تثبيت خدمة Clash Verge صلاحيات المسؤول.
  translocatedCorePath: Clash Verge is running from a temporary (App Translocation) path and can't locate the core. Please move Clash Verge into the Applications folder and reopen it.
  ipcNotReady: The Clash Verge service did not respond in time after installation. Please try again in a moment; if it keeps failing, restart your computer or check whether security software is blocking the service.
